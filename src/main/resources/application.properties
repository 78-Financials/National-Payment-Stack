spring.application.name=Nigerian Payment Stack

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Database Configuration - PostgreSQL
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/nps_db}
spring.datasource.username=${DATABASE_USERNAME:nps_user}
spring.datasource.password=${DATABASE_PASSWORD:nps_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true

# Logging Configuration
logging.level.com.payaza.nps=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.info.env.enabled=true

# NPS Configuration - National Payment Stack Nigeria
nps.base-url=https://nps.nibss-plc.com.ng
nps.client-id=${NPS_CLIENT_ID:your-nps-client-id}
nps.client-secret=${NPS_CLIENT_SECRET:your-nps-client-secret}
nps.merchant-id=${NPS_MERCHANT_ID:your-bank-code}
nps.timeout-seconds=30
nps.enable-encryption=true
nps.encryption-key=${NPS_ENCRYPTION_KEY:your-32-char-aes-256-key-here}
nps.callback-url=${NPS_CALLBACK_URL:http://localhost:8080/api/v1/nps/identification/callback/report}

# NPS Specific Settings
nps.message-format=ISO20022
nps.encryption-mode=AES-256-GCM
nps.async-processing=true
nps.support-unknown-tags=true

# Security Configuration
spring.security.user.name=admin
spring.security.user.password=${ADMIN_PASSWORD:admin123}

# Admin Configuration
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:admin123}

# Default Admin Client (for initial setup)
admin.default-client-id=ADMIN
admin.default-client-name=System Administrator
admin.default-api-key=admin_api_key_99999_secure_default
admin.default-transaction-prefix=ADM
admin.default-allowed-endpoints=pacs008,acmt023,acmt024,pacs002,pacs028
admin.default-active=true
admin.default-rate-limit-per-minute=1000

# Scheduling Configuration for EOD Processing
spring.task.scheduling.pool.size=2
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=4

# Amazon SQS Configuration
aws.region=${AWS_REGION:us-east-1}
aws.sqs.inbound-pacs008-queue=${INBOUND_PACS008_QUEUE:inbound-pacs008-queue}
aws.sqs.inbound-error-queue=${INBOUND_ERROR_QUEUE:inbound-error-queue}
aws.sqs.outbound-pacs002-queue=${OUTBOUND_PACS002_QUEUE:outbound-pacs002-queue}

# SQS Message Processing Configuration
sqs.message.visibility-timeout=300
sqs.message.max-receive-count=3
sqs.message.dead-letter-queue-enabled=true
sqs.message.retry-delay=60

# Inbound PACS.008 Processing Configuration
inbound.pacs008.processing-timeout=200
inbound.pacs008.max-queue-size=10000
inbound.pacs008.enable-notifications=true
inbound.pacs008.alert-threshold=1000

# Notification System Configuration
# Email API Configuration
nps.notifications.email.api-url=${EMAIL_API_URL:http://localhost:8090/live/send-email-without-template}
nps.notifications.email.api-key=${EMAIL_API_KEY:yRWTlNCmDoacSTIJS3BcLM6kAQ9jL5E9TOqXdjld}
nps.notifications.email.sender=${EMAIL_SENDER:nps@payaza.africa}
nps.notifications.email.recipients=${EMAIL_RECIPIENTS:admin@payaza.africa}

# Slack Configuration
nps.notifications.slack.webhook-url=${SLACK_WEBHOOK_URL:}

# Webhook Configuration
nps.notifications.webhook.url=${WEBHOOK_URL:}
nps.notifications.webhook.api-key=${WEBHOOK_API_KEY:}

# Retry Configuration
nps.notifications.retry.max-attempts=${NOTIFICATION_RETRY_MAX_ATTEMPTS:3}
nps.notifications.retry.interval-seconds=${NOTIFICATION_RETRY_INTERVAL:300}

# Alert System Configuration
nps.alerts.default-enabled-message-types=${NPS_ALERTS_DEFAULT_ENABLED_MESSAGE_TYPES:PACS008,PACS002,ACMT023,ACMT024,PACS028}
nps.alerts.default-suppression-duration-hours=${NPS_ALERTS_DEFAULT_SUPPRESSION_DURATION_HOURS:0}
nps.alerts.max-alerts-per-hour=${NPS_ALERTS_MAX_ALERTS_PER_HOUR:100}
nps.alerts.analytics-retention-days=${NPS_ALERTS_ANALYTICS_RETENTION_DAYS:30}

# JWT Configuration
jwt.secret=${JWT_SECRET:mySecretKey}
jwt.expiration=${JWT_EXPIRATION:3600}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:86400}

# Rate Limiting Configuration
nps.rate-limit.default-hourly-limit=${RATE_LIMIT_DEFAULT_HOURLY_LIMIT:1000}
nps.rate-limit.default-daily-limit=${RATE_LIMIT_DEFAULT_DAILY_LIMIT:10000}
nps.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}

# System Monitoring Configuration
nps.monitoring.health-check-interval=${HEALTH_CHECK_INTERVAL:60000}
nps.monitoring.metrics-retention-days=${METRICS_RETENTION_DAYS:7}
nps.monitoring.log-retention-days=${LOG_RETENTION_DAYS:30}

# Report Generation Configuration
nps.reports.max-concurrent-reports=${MAX_CONCURRENT_REPORTS:5}
nps.reports.default-export-format=${DEFAULT_EXPORT_FORMAT:json}
nps.reports.scheduled-reports-enabled=${SCHEDULED_REPORTS_ENABLED:true}

# Webhook Configuration
nps.webhooks.max-delivery-attempts=${WEBHOOK_MAX_DELIVERY_ATTEMPTS:3}
nps.webhooks.delivery-timeout-seconds=${WEBHOOK_DELIVERY_TIMEOUT:30}
nps.webhooks.retry-interval-seconds=${WEBHOOK_RETRY_INTERVAL:60}

spring.main.allow-bean-definition-overriding=true