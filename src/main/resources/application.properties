spring.application.name=Nigerian Payment Stack

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Database Configuration (H2 for development)
spring.datasource.url=jdbc:h2:mem:npsdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging Configuration
logging.level.com.payaza.nps=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.info.env.enabled=true

# NPS Configuration - National Payment Stack Nigeria
nps.base-url=https://nps.nibss-plc.com.ng
nps.client-id=${NPS_CLIENT_ID:your-nps-client-id}
nps.client-secret=${NPS_CLIENT_SECRET:your-nps-client-secret}
nps.merchant-id=${NPS_MERCHANT_ID:your-bank-code}
nps.timeout-seconds=30
nps.enable-encryption=true
nps.encryption-key=${NPS_ENCRYPTION_KEY:your-32-char-aes-256-key-here}
nps.callback-url=${NPS_CALLBACK_URL:http://localhost:8080/api/v1/nps/identification/callback/report}

# NPS Specific Settings
nps.message-format=ISO20022
nps.encryption-mode=AES-256-GCM
nps.async-processing=true
nps.support-unknown-tags=true

# Security Configuration
spring.security.user.name=admin
spring.security.user.password=${ADMIN_PASSWORD:admin123}

# Scheduling Configuration
spring.task.scheduling.pool.size=5
