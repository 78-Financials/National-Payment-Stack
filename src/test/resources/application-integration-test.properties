# Integration test properties - allows full Spring context to load
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# Disable Flyway for integration tests (migrations are PostgreSQL-specific)
spring.flyway.enabled=false

# Mock NPS configuration for integration tests
nps.client-id=test-client-id
nps.client-secret=test-client-secret
nps.merchant-id=test-merchant-id
nps.base-url=http://localhost:8080/test
nps.timeout-seconds=30
nps.enable-encryption=false
nps.encryption-key=test-encryption-key-32-characters-long
nps.callback-url=http://localhost:8080/test/callback

# Admin configuration
admin.default-api-key=admin_api_key_99999_secure_default

# JWT configuration for integration tests
jwt.secret=mySecretKeyForIntegrationTestsMustBeAtLeast64CharactersLongForHS512Algorithm
jwt.expiration=3600
jwt.refresh-expiration=86400

# Disable problematic auto-configurations that cause issues in integration tests
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.actuate.ActuatorAutoConfiguration,\
  org.springframework.boot.autoconfigure.aws.sqs.SqsAutoConfiguration,\
  org.springframework.boot.autoconfigure.task.TaskSchedulingAutoConfiguration,\
  org.springframework.boot.autoconfigure.task.TaskExecutionAutoConfiguration

# Allow bean definition overriding for tests
spring.main.allow-bean-definition-overriding=true
