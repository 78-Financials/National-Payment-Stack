# Test Configuration
spring.application.name=NPS Test Application

# Test Database Configuration - Use H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration for Tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Disable security for easier testing (can be overridden in specific tests)
spring.security.user.name=test
spring.security.user.password=test

# Test Logging Configuration
logging.level.com.payaza.nps=DEBUG
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Test NPS Configuration
nps.base-url=https://test.nibss-plc.com.ng
nps.client-id=test-client-id
nps.client-secret=test-client-secret
nps.merchant-id=test-merchant-id
nps.timeout-seconds=10
nps.enable-encryption=false
nps.encryption-key=test-encryption-key-32-chars-long
nps.callback-url=http://localhost:8080/api/v1/nps/test/callback

# Test Admin Configuration
admin.username=test-admin
admin.password=test-admin-password

# Default Admin Client (for tests)
admin.default-client-id=ADMIN
admin.default-client-name=System Administrator
admin.default-api-key=admin_api_key_99999
admin.default-transaction-prefix=ADM
admin.default-allowed-endpoints=pacs008,acmt023,acmt024,pacs002,pacs028
admin.default-active=true
admin.default-rate-limit-per-minute=1000

# Disable scheduling for tests
spring.task.scheduling.enabled=false