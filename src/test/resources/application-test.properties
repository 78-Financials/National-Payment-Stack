# Test Configuration
# Note: spring.profiles.active should not be set in profile-specific files

# Database Configuration (H2 for testing)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Disable Flyway for tests
spring.flyway.enabled=false

# Disable problematic auto-configurations for tests
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,\
  org.springframework.boot.autoconfigure.web.servlet.WebMvcAutoConfiguration,\
  org.springframework.boot.autoconfigure.web.reactive.WebFluxAutoConfiguration,\
  org.springframework.boot.autoconfigure.cloud.aws.autoconfigure.sqs.SqsAutoConfiguration,\
  org.springframework.boot.autoconfigure.task.TaskSchedulingAutoConfiguration,\
  org.springframework.boot.autoconfigure.task.TaskExecutionAutoConfiguration

# Exclude main security configuration from test context
spring.main.allow-bean-definition-overriding=true

# Disable AWS SQS for tests
aws.sqs.enabled=false
spring.cloud.aws.sqs.enabled=false

# Disable scheduling for tests
spring.task.scheduling.enabled=false
spring.task.execution.enabled=false

# Disable async processing for tests
spring.main.allow-bean-definition-overriding=true

# Security Configuration
spring.security.user.name=admin
spring.security.user.password=admin
spring.security.user.roles=ADMIN

# NPS Configuration (Mock values for testing)
nps.client-id=test-client-id
nps.client-secret=test-client-secret
nps.merchant-id=test-merchant-id
nps.base-url=https://test.nibss.com
nps.timeout-seconds=30
nps.enable-encryption=false
nps.encryption-key=test-encryption-key-32-characters-long
nps.callback-url=http://localhost:8080/test/callback

# Endpoints (Mock URLs for testing)
nps.acmt023-endpoint=/test/acmt023
nps.acmt024-endpoint=/test/acmt024
nps.pacs008-endpoint=/test/pacs008
nps.pacs002-endpoint=/test/pacs002
nps.pacs028-endpoint=/test/pacs028
nps.participants-endpoint=/test/participants

# Admin Configuration
admin.default-client-id=ADMIN
admin.default-client-name=System Administrator
admin.default-api-key=admin_api_key_99999_secure_default

# Logging Configuration
logging.level.com.payaza.nps=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

# Scheduling Configuration
nps.cache-refresh-interval=60000
nps.eod-processing-time=23:30
nps.alert-evaluation-interval=300000

# Alert Configuration
nps.alerts.enabled=true
nps.alerts.email.enabled=false
nps.alerts.sms.enabled=false
nps.alerts.slack.enabled=false
nps.alerts.webhook.enabled=false

# Metrics Configuration
nps.metrics.collection-interval=60000
nps.metrics.retention-days=30

# Performance Configuration
nps.performance.slow-query-threshold=5000
nps.performance.high-cpu-threshold=80
nps.performance.high-memory-threshold=85

# Rate Limiting
nps.rate-limiting.enabled=true
nps.rate-limiting.default-limit=1000
nps.rate-limiting.window-size=3600