# Test Configuration for NPS Integration Service
# This overrides production NIBSS endpoints with mock endpoints for testing

# NPS Configuration - Mock endpoints for testing
nps.base-url=http://localhost:9999
nps.client-id=test-client-id
nps.client-secret=test-client-secret
nps.merchant-id=test-merchant-id
nps.timeout-seconds=5
nps.enable-encryption=true
nps.encryption-key=test-32-char-aes-256-key-here
nps.callback-url=http://localhost:8080/api/v1/nps/callback

# NPS Specific Settings
nps.message-format=ISO20022
nps.encryption-mode=AES-256-GCM
nps.async-processing=true
nps.support-unknown-tags=true

# Mock endpoint URLs for testing
nps.acmt023.endpoint=http://localhost:9999/acmt023
nps.acmt024.endpoint=http://localhost:9999/acmt024
nps.pacs008.endpoint=http://localhost:9999/pacs008
nps.pacs002.endpoint=http://localhost:9999/pacs002
nps.pacs028.endpoint=http://localhost:9999/pacs028
nps.participants.endpoint=http://localhost:9999/participants

# Test RSA Key Configuration
nps.private-key.file=test-keys/private-key.pem
nps.public-key.file=test-keys/public-key.pem
nps.nps-public-key.file=test-keys/nps-public-key.pem
